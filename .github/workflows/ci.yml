name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Typecheck · Lint · Build · Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Unit tests (Vitest)
        run: npm test

      - name: TypeScript check (fail on errors)
        run: npx tsc --noEmit

      - name: ESLint (fail on errors)
        run: npx next lint

      - name: Production build (strict TS + lint)
        env:
          # Dummy build-time values; real secrets live in deployment env.
          JWT_SECRET: ci-build-only-secret-value-that-is-long-enough-32chars
          DATABASE_URL: "mysql://user:pass@localhost:3306/db"
        run: npm run build

      - name: Dependency audit (high/critical)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true # report-only until existing advisories are triaged
